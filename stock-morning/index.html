<!doctype html>
<html lang="ko">
<head>

  <header class="top">

      <div id="study-list"></div>
    </section>

  <footer class="wrap foot">공부용 정보 정리이며 투자 권유가 아닙니다. 투자 판단과 책임은 본인에게 있습니다.</footer>

  <script src="./data/study.js"></script>
  <script src="./data/reports.js"></script>
  <script src="./assets/app.js"></script>
