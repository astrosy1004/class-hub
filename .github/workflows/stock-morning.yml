name: 모닝 마켓 브리핑 메일 (평일 06:30 KST)

on:
  schedule:
    # 일~목 UTC = 월~금 KST. 본 실행은 06:27 KST (미국장 마감 06:00 KST 뒤, 정각·30분은 GitHub 이 가장 붐벼 3분 비켜 둠).
    # GitHub 예약은 몇 시간 늦거나 건너뛰는 일이 있어, 같은 일을 30분 간격으로 3번 더 예약해 둔다.
    # 이미 그 거래일 보고서가 저장돼 있으면 daily.js 가 건너뛰므로 메일이 중복 발송되지 않는다.
    - cron: '27 21 * * 0-4'   # 06:27 KST (본 실행)
    - cron: '57 21 * * 0-4'   # 06:57 KST (예비 1)
    - cron: '27 22 * * 0-4'   # 07:27 KST (예비 2)
    - cron: '57 22 * * 0-4'   # 07:57 KST (예비 3)
  workflow_dispatch:
    inputs:
      force:
        description: '같은 거래일 보고서가 있어도 다시 만들어 보내기'
        type: boolean
        default: false
      preview:
        description: '미리보기: 메일 발송·저장소 커밋 없이 보고서 파일만 만들어 내려받기'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stock-morning
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 보고서 생성
        id: report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: node stock-morning/scripts/daily.js ${{ inputs.force && '--force' || '' }}

      - name: 미리보기 파일 보관 (메일·커밋 없음)
        if: steps.report.outputs.skip != 'true' && inputs.preview
        uses: actions/upload-artifact@v4
        with:
          name: stock-morning-preview
          path: |
            ${{ steps.report.outputs.file }}
            ${{ steps.report.outputs.attach }}
          retention-days: 3

      - name: 메일 발송
        if: steps.report.outputs.skip != 'true' && !inputs.preview
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.report.outputs.subject }}
          to: ${{ secrets.MAIL_TO }}
          from: 모닝 마켓 브리핑 <${{ secrets.MAIL_USERNAME }}>
          html_body: file://${{ steps.report.outputs.file }}
          attachments: ${{ steps.report.outputs.attach }}

      - name: 보고서 커밋 (웹 아카이브)
        if: steps.report.outputs.skip != 'true' && !inputs.preview
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock-morning/reports stock-morning/analysis stock-morning/data/reports.js stock-morning/data/listing.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "모닝 브리핑 보고서 자동 추가 (stock-morning/) [skip ci]"
            git pull --rebase
            git push
          fi
