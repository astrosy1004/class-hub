name: 생활인구 수집 (location, 매일 07시 KST)

on:
  schedule:
    - cron: '0 22 * * *'   # 22:00 UTC = 07:00 KST (서울 API 는 며칠 지연되므로 최신 2일치를 확인)
  workflow_dispatch:
    inputs:
      days:
        description: '수집할 최근 일수 (과거 채우기는 60 정도)'
        required: false
        default: '2'

concurrency:
  group: location-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: npm install --no-audit --no-fund --prefix location/collector

      - name: 서울 생활인구 수집 → Firestore
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RONE_API_KEY: ${{ secrets.RONE_API_KEY }}   # 임대료 참고 자료(한국부동산원), 없으면 건너뜀
        run: node location/collector/collect.js --days "${{ github.event.inputs.days || '2' }}"
