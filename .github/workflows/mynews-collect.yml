name: 뉴스 수집 (2시간마다)

on:
  schedule:
    - cron: '0 */2 * * *'   # UTC 기준 2시간마다
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mynews-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: RSS 수집
        run: node mynews-2609/scripts/collect.js

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- mynews-2609/data/news.js; then
            echo "변경 없음"
          else
            git add mynews-2609/data/news.js
            git commit -m "뉴스 데이터 자동 갱신 (mynews-2609/) [skip ci]"
            git push
          fi
