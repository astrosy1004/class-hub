<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 기질 그래프</title>
<meta name="description" content="생년월일시로 사주 명식을 풀어 인생 흐름을 그래프로 보여주는 해석 앱 (참고용)">
<meta name="theme-color" content="#e3dcfa">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23ece7fd'/><path d='M10 44l12-14 10 8 22-20' fill='none' stroke='%235b3fd9' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/><circle cx='32' cy='38' r='5' fill='%23c3367a'/></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="./css/style.css?v=4">
<script>
  // 저장된 테마를 그리기 전에 적용 (깜빡임 방지)
  try {
    const t = JSON.parse(localStorage.getItem("sajuTheme"));
    if (t && t !== "lavender") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>
<div class="app">
  <!-- 화면은 주소 # 뒤로 바뀐다. 내용은 js/ui.js가 그린다 -->
  <section class="view" data-view="home" hidden></section>
  <section class="view" data-view="fortune" hidden></section>
  <section class="view" data-view="monthly" hidden></section>
  <section class="view" data-view="life" hidden></section>
  <section class="view" data-view="job" hidden></section>
  <section class="view" data-view="me" hidden></section>
  <section class="view" data-view="chart" hidden></section>
  <section class="view" data-view="charts" hidden></section>
  <section class="view" data-view="manse" hidden></section>

  <nav class="tabbar" aria-label="주요 메뉴">
    <a href="#home" data-tab="home"><span data-icon="home"></span>홈</a>
    <a href="#fortune" data-tab="fortune"><span data-icon="bars"></span>운세</a>
    <a href="#chart" data-tab="chart"><span data-icon="grid"></span>만세력</a>
    <a href="#me" data-tab="me"><span data-icon="user"></span>나의 기질</a>
  </nav>
</div>

<div class="sheet-back" id="themeSheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="themeTitle">
    <h2 id="themeTitle">화면 테마</h2>
    <div class="themes" id="themeButtons"></div>
  </div>
</div>

<script type="module" src="./js/main.js?v=4"></script>
</body>
</html>
