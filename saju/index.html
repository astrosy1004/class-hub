<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>팔자도 · 그래프로 보는 사주</title>
<meta name="description" content="팔자도(八字圖) — 생년월일시로 사주 명식을 풀어 인생 흐름을 그래프로 보여주는 해석 앱 (참고용)">
<meta name="theme-color" content="#e3dcfa">
<link rel="icon" type="image/svg+xml" href="./img/logo.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="./css/style.css?v=36">
<script>
  // 저장된 테마를 그리기 전에 적용 (깜빡임 방지)
  try {
    const t = JSON.parse(localStorage.getItem("sajuTheme"));
    if (t && t !== "lavender") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>
<div class="app">
  <!-- 화면은 주소 # 뒤로 바뀐다. 내용은 js/ui.js가 그린다 -->
  <section class="view" data-view="intro" hidden></section>
  <section class="view" data-view="home" hidden></section>
  <section class="view" data-view="today" hidden></section>
  <section class="view" data-view="fortune" hidden></section>
  <section class="view" data-view="monthly" hidden></section>
  <section class="view" data-view="life" hidden></section>
  <section class="view" data-view="ask" hidden></section>
  <section class="view" data-view="basis" hidden></section>
  <section class="view" data-view="guide" hidden></section>
  <section class="view" data-view="job" hidden></section>
  <section class="view" data-view="me" hidden></section>
  <section class="view" data-view="chart" hidden></section>
  <section class="view" data-view="charts" hidden></section>
  <section class="view" data-view="manse" hidden></section>

  <nav class="tabbar" aria-label="주요 메뉴">
    <a href="#home" data-tab="home"><span data-icon="home"></span>홈</a>
    <a href="#today" data-tab="fortune"><span data-icon="bars"></span>운세</a>
    <a href="#ask" data-tab="ask"><span data-icon="chat"></span>상담</a>
    <a href="#me" data-tab="me"><span data-icon="user"></span>나</a>
    <a href="#chart" data-tab="chart"><span data-icon="grid"></span>만세력</a>
  </nav>
</div>

<script type="module" src="./js/main.js?v=36"></script>
</body>
</html>
