<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>연혁 영상 메이커</title>
  <meta name="description" content="인물의 과거·현재 사진과 주요 사건을 연도순으로 이어 붙여 유튜브용 연혁 영상을 만드는 도구">
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>연혁 영상 메이커</h1>
      <p class="sub">과거 → 현재 사진과 주요 사건을 연도순으로 이어 붙여 영상으로 저장합니다.</p>
    </div>
    <button id="themeBtn" class="ghost" type="button" aria-label="다크 모드 전환">🌓</button>
  </header>

  <main class="layout">
    <section class="panel preview">
      <div class="stage"><canvas id="stage" width="1280" height="720"></canvas></div>

      <div class="transport">
        <button id="playBtn" type="button">▶ 미리보기</button>
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="재생 위치">
        <span id="timeLabel" class="mono">0:00 / 0:00</span>
      </div>

      <div class="actions">
        <button id="recBtn" class="primary" type="button">🎬 영상 만들기 (실시간 녹화)</button>
        <span id="recStatus" class="muted"></span>
      </div>
      <a id="downloadLink" class="download" hidden>⬇ 영상 다운로드</a>

      <p class="note">
        녹화는 재생 시간만큼 걸립니다. 녹화 중에는 이 탭을 닫거나 다른 탭으로 전환하지 마세요.<br>
        사진의 저작권·초상권, 기사 내용의 사실 여부는 직접 확인하고 출처를 꼭 적어 주세요.
      </p>
    </section>

    <section class="panel editor">
      <h2>기본 설정</h2>
      <div class="grid2">
        <label>인물 이름<input id="person" type="text"></label>
        <label>부제<input id="subtitle" type="text"></label>
        <label>화면 비율
          <select id="ratio">
            <option value="16:9">가로 16:9 (일반 영상)</option>
            <option value="9:16">세로 9:16 (쇼츠)</option>
          </select>
        </label>
        <label>장면 전환
          <select id="transition">
            <option value="fade">부드럽게 겹치기</option>
            <option value="wipe">와이프 (밀어서 변신)</option>
            <option value="slide">슬라이드</option>
            <option value="cut">컷</option>
          </select>
        </label>
        <label>장면당 시간(초)<input id="slideSec" type="number" min="2" max="15" step="0.5"></label>
        <label>배경음악(선택)<input id="bgm" type="file" accept="audio/*"></label>
      </div>

      <div class="row-head">
        <h2>연혁 장면</h2>
        <div class="row-btns">
          <label class="btn ghost">📷 사진 여러 장으로 추가<input id="bulk" type="file" accept="image/*" multiple hidden></label>
          <button id="addBtn" type="button">＋ 장면 추가</button>
        </div>
      </div>
      <div id="slideList" class="slide-list"></div>
    </section>
  </main>

  <script src="./assets/app.js"></script>
</body>
</html>
