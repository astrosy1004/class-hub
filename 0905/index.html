<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사다리 게임</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070a14;
      --panel: rgba(10, 18, 35, 0.82);
      --ink: #e9fbff;
      --muted: #93a4bf;
      --line: rgba(116, 245, 255, 0.28);
      --brand: #00e5ff;
      --brand-dark: #6c5cff;
      --accent: #ff3df2;
      --win: #39ff9c;
      --shadow: 0 18px 60px rgba(0, 229, 255, 0.12), 0 0 40px rgba(255, 61, 242, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(rgba(116, 245, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(116, 245, 255, 0.05) 1px, transparent 1px),
        radial-gradient(circle at 14% 12%, rgba(0, 229, 255, 0.22), transparent 28rem),
        radial-gradient(circle at 86% 10%, rgba(255, 61, 242, 0.18), transparent 26rem),
        radial-gradient(circle at 50% 100%, rgba(57, 255, 156, 0.1), transparent 28rem),
        var(--bg);
      background-size: 34px 34px, 34px 34px, auto, auto, auto, auto;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, transparent 0%, rgba(255, 255, 255, 0.04) 50%, transparent 100%);
      background-size: 100% 7px;
      mix-blend-mode: screen;
      opacity: 0.28;
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 36px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 44px);
      letter-spacing: 0;
      color: #f6fdff;
      text-shadow: 0 0 12px rgba(0, 229, 255, 0.65), 0 0 30px rgba(255, 61, 242, 0.35);
    }

    .sub {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .shell {
      display: grid;
      grid-template-columns: 330px 1fr;
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: linear-gradient(180deg, rgba(13, 24, 46, 0.9), rgba(7, 12, 24, 0.88));
      border: 1px solid rgba(116, 245, 255, 0.32);
      border-radius: 8px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .controls {
      padding: 18px;
      position: sticky;
      top: 18px;
    }

    .board-panel {
      min-height: 660px;
      padding: 18px;
      overflow: hidden;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-size: 13px;
      font-weight: 700;
      color: #b8f7ff;
      text-shadow: 0 0 12px rgba(0, 229, 255, 0.36);
    }

    textarea, input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 11px;
      font: inherit;
      color: var(--ink);
      background: rgba(2, 8, 20, 0.78);
      outline: none;
      box-shadow: inset 0 0 18px rgba(0, 229, 255, 0.05);
    }

    textarea {
      min-height: 116px;
      resize: vertical;
      line-height: 1.45;
    }

    textarea:focus, input:focus, select:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.12), 0 0 24px rgba(0, 229, 255, 0.22);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      min-height: 42px;
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      color: #06101e;
      background: linear-gradient(135deg, var(--brand), #39ff9c);
      transition: transform 0.12s ease, background 0.12s ease, box-shadow 0.12s ease;
      box-shadow: 0 0 18px rgba(0, 229, 255, 0.25);
    }

    button:hover {
      background: linear-gradient(135deg, #69f4ff, #64ffb2);
      box-shadow: 0 0 22px rgba(0, 229, 255, 0.5), 0 8px 22px rgba(0, 0, 0, 0.32);
      transform: translateY(-1px);
    }

    button.secondary {
      color: #b8f7ff;
      background: rgba(13, 26, 50, 0.9);
      border: 1px solid rgba(116, 245, 255, 0.34);
    }

    button.secondary:hover {
      background: rgba(22, 40, 72, 0.94);
      box-shadow: 0 0 18px rgba(0, 229, 255, 0.2);
    }

    button.danger {
      color: #fff;
      background: linear-gradient(135deg, var(--accent), #6c5cff);
    }

    button.danger:hover {
      background: linear-gradient(135deg, #ff67f6, #887aff);
    }

    .status {
      margin-top: 14px;
      padding: 11px 12px;
      min-height: 42px;
      border-radius: 8px;
      background: rgba(2, 8, 20, 0.62);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .picker {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: min(100%, 360px);
    }

    .picker select {
      min-width: 160px;
    }

    .canvas-wrap {
      width: 100%;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #050a16;
      box-shadow: inset 0 0 50px rgba(0, 229, 255, 0.08), 0 0 24px rgba(108, 92, 255, 0.1);
    }

    canvas {
      display: block;
      min-width: 720px;
      width: 100%;
      height: 520px;
    }

    .results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .result-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: linear-gradient(180deg, rgba(12, 25, 48, 0.94), rgba(5, 10, 22, 0.94));
      min-height: 78px;
      box-shadow: 0 0 18px rgba(57, 255, 156, 0.08);
    }

    .result-card strong {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .result-card span {
      color: var(--win);
      font-weight: 800;
      text-shadow: 0 0 14px rgba(57, 255, 156, 0.48);
    }

    .hint {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    @media (max-width: 880px) {
      header,
      .shell {
        display: block;
      }

      .controls {
        position: static;
        margin-bottom: 16px;
      }

      .board-panel {
        min-height: auto;
      }

      canvas {
        height: 500px;
      }
    }

    @media (max-width: 540px) {
      main {
        width: min(100% - 20px, 1180px);
        padding-top: 18px;
      }

      .row,
      .button-row {
        grid-template-columns: 1fr;
      }

      .toolbar,
      .picker {
        align-items: stretch;
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>사다리 게임</h1>
        <p class="sub">참가자와 결과를 넣고 사다리를 생성한 뒤, 선택한 사람의 도착지를 확인하세요.</p>
      </div>
    </header>

    <section class="shell">
      <aside class="panel controls" aria-label="게임 설정">
        <label for="names">참가자</label>
        <textarea id="names" spellcheck="false">민수
지영
현우
서연</textarea>

        <label for="prizes">결과</label>
        <textarea id="prizes" spellcheck="false">커피 사기
통과
간식 사기
통과</textarea>

        <div class="row">
          <div>
            <label for="height">사다리 높이</label>
            <input id="height" type="number" min="6" max="24" value="12">
          </div>
          <div>
            <label for="density">가로줄 수</label>
            <input id="density" type="number" min="4" max="40" value="14">
          </div>
        </div>

        <div class="button-row">
          <button id="buildBtn" type="button">생성</button>
          <button id="shuffleBtn" class="secondary" type="button">섞기</button>
        </div>
        <div class="button-row">
          <button id="traceBtn" type="button">선택 확인</button>
          <button id="allBtn" class="danger" type="button">전체 공개</button>
        </div>

        <div id="status" class="status" role="status">참가자 수와 결과 수는 같아야 합니다.</div>
        <p class="hint">각 줄에 한 명씩 입력하세요. 같은 사다리에서 다시 확인하려면 참가자 선택만 바꾸면 됩니다.</p>
      </aside>

      <section class="panel board-panel" aria-label="사다리판">
        <div class="toolbar">
          <div class="picker">
            <label for="playerSelect" style="margin:0;">선택</label>
            <select id="playerSelect"></select>
          </div>
          <button id="clearBtn" class="secondary" type="button">표시 지우기</button>
        </div>

        <div class="canvas-wrap">
          <canvas id="ladder" width="980" height="560" aria-label="사다리 게임판"></canvas>
        </div>

        <div id="results" class="results" aria-live="polite"></div>
      </section>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("ladder");
    const ctx = canvas.getContext("2d");
    const namesEl = document.getElementById("names");
    const prizesEl = document.getElementById("prizes");
    const heightEl = document.getElementById("height");
    const densityEl = document.getElementById("density");
    const statusEl = document.getElementById("status");
    const playerSelect = document.getElementById("playerSelect");
    const resultsEl = document.getElementById("results");

    const state = {
      names: [],
      prizes: [],
      rows: 12,
      links: [],
      paths: [],
      allResults: false
    };

    function lines(value) {
      return value.split(/\r?\n/).map(item => item.trim()).filter(Boolean);
    }

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.style.color = isError ? "#ff9ca8" : "#93a4bf";
      statusEl.style.borderColor = isError ? "rgba(255, 61, 100, 0.6)" : "rgba(116, 245, 255, 0.28)";
      statusEl.style.background = isError ? "rgba(82, 8, 31, 0.56)" : "rgba(2, 8, 20, 0.62)";
    }

    function shuffleArray(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function validate() {
      const names = lines(namesEl.value);
      const prizes = lines(prizesEl.value);

      if (names.length < 2) {
        setStatus("참가자를 2명 이상 입력해 주세요.", true);
        return null;
      }
      if (names.length !== prizes.length) {
        setStatus(`참가자 ${names.length}명, 결과 ${prizes.length}개입니다. 개수를 맞춰 주세요.`, true);
        return null;
      }
      if (names.length > 12) {
        setStatus("화면 가독성을 위해 참가자는 최대 12명까지 권장합니다.", true);
        return null;
      }

      return {
        names,
        prizes,
        rows: Math.max(6, Math.min(24, Number(heightEl.value) || 12)),
        count: Math.max(4, Math.min(40, Number(densityEl.value) || 14))
      };
    }

    function buildLinks(columns, rows, count) {
      const links = [];
      const occupied = new Set();
      let attempts = 0;

      while (links.length < count && attempts < count * 80) {
        attempts += 1;
        const row = Math.floor(Math.random() * rows);
        const col = Math.floor(Math.random() * (columns - 1));
        const key = `${row}-${col}`;
        const leftKey = `${row}-${col - 1}`;
        const rightKey = `${row}-${col + 1}`;

        if (occupied.has(key) || occupied.has(leftKey) || occupied.has(rightKey)) continue;

        occupied.add(key);
        links.push({ row, col });
      }

      return links.sort((a, b) => a.row - b.row || a.col - b.col);
    }

    function positions() {
      const columns = state.names.length;
      const width = Math.max(720, canvas.width);
      const top = 76;
      const bottom = canvas.height - 76;
      const left = 72;
      const right = width - 72;
      const gapX = columns === 1 ? 0 : (right - left) / (columns - 1);
      const gapY = state.rows === 1 ? 0 : (bottom - top) / state.rows;

      return { top, bottom, left, right, gapX, gapY };
    }

    function draw() {
      const { top, bottom, left, gapX, gapY } = positions();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#050a16";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawGrid();

      ctx.lineCap = "round";
      ctx.shadowColor = "rgba(0, 229, 255, 0.82)";
      ctx.shadowBlur = 12;
      ctx.strokeStyle = "#74f5ff";
      ctx.lineWidth = 5;
      for (let i = 0; i < state.names.length; i += 1) {
        const x = left + gapX * i;
        ctx.beginPath();
        ctx.moveTo(x, top);
        ctx.lineTo(x, bottom);
        ctx.stroke();
      }

      ctx.shadowColor = "rgba(255, 61, 242, 0.78)";
      ctx.shadowBlur = 14;
      ctx.strokeStyle = "#ff3df2";
      ctx.lineWidth = 6;
      state.links.forEach(link => {
        const y = top + gapY * (link.row + 0.5);
        const x1 = left + gapX * link.col;
        const x2 = left + gapX * (link.col + 1);
        ctx.beginPath();
        ctx.moveTo(x1, y);
        ctx.lineTo(x2, y);
        ctx.stroke();
      });

      state.paths.forEach((path, index) => {
        drawPath(path.points, index);
      });

      ctx.shadowBlur = 0;
      drawLabels();
    }

    function drawGrid() {
      ctx.save();
      ctx.strokeStyle = "rgba(116, 245, 255, 0.08)";
      ctx.lineWidth = 1;
      for (let x = 0; x <= canvas.width; x += 28) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y <= canvas.height; y += 28) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      const gradient = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, 40, canvas.width / 2, canvas.height / 2, canvas.width / 1.4);
      gradient.addColorStop(0, "rgba(0, 229, 255, 0.08)");
      gradient.addColorStop(0.52, "rgba(108, 92, 255, 0.06)");
      gradient.addColorStop(1, "rgba(0, 0, 0, 0.42)");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.restore();
    }

    function drawLabels() {
      const { top, bottom, left, gapX } = positions();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "700 15px Arial, sans-serif";

      state.names.forEach((name, index) => {
        const x = left + gapX * index;
        pill(name, x, top - 38, "rgba(0, 229, 255, 0.16)", "#e9fbff", "#00e5ff");
      });

      state.prizes.forEach((prize, index) => {
        const x = left + gapX * index;
        pill(prize, x, bottom + 38, "rgba(57, 255, 156, 0.13)", "#c8ffe2", "#39ff9c");
      });
    }

    function pill(text, x, y, bg, fg, border = bg) {
      const maxWidth = Math.max(74, Math.min(120, positions().gapX - 12 || 120));
      const label = text.length > 8 ? `${text.slice(0, 8)}...` : text;
      const width = Math.min(maxWidth, Math.max(62, ctx.measureText(label).width + 24));
      const height = 30;
      const radius = 8;

      ctx.beginPath();
      ctx.roundRect(x - width / 2, y - height / 2, width, height, radius);
      ctx.fillStyle = bg;
      ctx.shadowColor = border;
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.strokeStyle = border;
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = fg;
      ctx.fillText(label, x, y + 1);
    }

    function trace(startColumn) {
      const { top, bottom, left, gapX, gapY } = positions();
      let col = startColumn;
      const points = [{ x: left + gapX * col, y: top }];

      for (let row = 0; row < state.rows; row += 1) {
        const y = top + gapY * (row + 0.5);
        points.push({ x: left + gapX * col, y });

        const right = state.links.find(link => link.row === row && link.col === col);
        const leftLink = state.links.find(link => link.row === row && link.col === col - 1);

        if (right) {
          points.push({ x: left + gapX * (col + 1), y });
          col += 1;
        } else if (leftLink) {
          points.push({ x: left + gapX * (col - 1), y });
          col -= 1;
        }
      }

      points.push({ x: left + gapX * col, y: bottom });
      return { start: startColumn, end: col, points };
    }

    function drawPath(points, index) {
      const colors = ["#39ff9c", "#ff3df2", "#00e5ff", "#ffd166", "#a78bfa", "#ff7aa8"];
      ctx.strokeStyle = colors[index % colors.length];
      ctx.shadowColor = colors[index % colors.length];
      ctx.shadowBlur = 18;
      ctx.lineWidth = 8;
      ctx.beginPath();
      points.forEach((point, pointIndex) => {
        if (pointIndex === 0) ctx.moveTo(point.x, point.y);
        else ctx.lineTo(point.x, point.y);
      });
      ctx.stroke();

      const last = points[points.length - 1];
      ctx.fillStyle = colors[index % colors.length];
      ctx.beginPath();
      ctx.arc(last.x, last.y, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function updateSelect() {
      playerSelect.innerHTML = "";
      state.names.forEach((name, index) => {
        const option = document.createElement("option");
        option.value = String(index);
        option.textContent = name;
        playerSelect.appendChild(option);
      });
    }

    function renderResults() {
      resultsEl.innerHTML = "";
      if (!state.paths.length) return;

      state.paths.forEach(path => {
        const card = document.createElement("div");
        card.className = "result-card";
        card.innerHTML = `<strong>${escapeHtml(state.names[path.start])}</strong><span>${escapeHtml(state.prizes[path.end])}</span>`;
        resultsEl.appendChild(card);
      });
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"
      }[char]));
    }

    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        this.beginPath();
        this.moveTo(x + r, y);
        this.arcTo(x + width, y, x + width, y + height, r);
        this.arcTo(x + width, y + height, x, y + height, r);
        this.arcTo(x, y + height, x, y, r);
        this.arcTo(x, y, x + width, y, r);
        this.closePath();
      };
    }

    function build() {
      const valid = validate();
      if (!valid) return;

      state.names = valid.names;
      state.prizes = valid.prizes;
      state.rows = valid.rows;
      state.links = buildLinks(valid.names.length, valid.rows, valid.count);
      state.paths = [];
      state.allResults = false;

      updateSelect();
      renderResults();
      draw();
      setStatus("사다리가 생성되었습니다. 참가자를 선택하고 확인해 보세요.");
    }

    function revealSelected() {
      if (!state.names.length) build();
      if (!state.names.length) return;

      const selected = Number(playerSelect.value) || 0;
      const path = trace(selected);
      state.paths = [path];
      state.allResults = false;
      draw();
      renderResults();
      setStatus(`${state.names[path.start]} 님의 결과는 "${state.prizes[path.end]}"입니다.`);
    }

    function revealAll() {
      if (!state.names.length) build();
      if (!state.names.length) return;

      state.paths = state.names.map((_, index) => trace(index));
      state.allResults = true;
      draw();
      renderResults();
      setStatus("전체 결과를 공개했습니다.");
    }

    document.getElementById("buildBtn").addEventListener("click", build);
    document.getElementById("traceBtn").addEventListener("click", revealSelected);
    document.getElementById("allBtn").addEventListener("click", revealAll);
    document.getElementById("clearBtn").addEventListener("click", () => {
      state.paths = [];
      renderResults();
      draw();
      setStatus("표시를 지웠습니다. 사다리는 그대로 유지됩니다.");
    });
    document.getElementById("shuffleBtn").addEventListener("click", () => {
      const prizes = lines(prizesEl.value);
      prizesEl.value = shuffleArray(prizes).join("\n");
      build();
    });

    build();
  </script>
</body>
</html>
